<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB659" />
      <stop offset="50%" stop-color="#F23E70" />
      <stop offset="100%" stop-color="#7D52FF" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F23E70" />
      <stop offset="50%" stop-color="#FFB659" />
      <stop offset="100%" stop-color="#FFF2A3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Keycap Outer Base -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="104" height="104" rx="26" fill="#0D0915" />
  
  <!-- Subtle Keycap Inner Top Bevel -->
  <rect x="20" y="20" width="88" height="40" rx="16" fill="white" opacity="0.08" />

  <!-- Animated-style Fire / Flame glyph -->
  <g filter="url(#glow)">
    <path d="M64 26 C66 38, 76 46, 78 58 C80 72, 69 82, 69 82 C74 76, 75 67, 72 61 C68 76, 56 83, 56 94 C56 102, 62 108, 68 108 C50 108, 38 94, 38 78 C38 60, 52 46, 58 38 C60 46, 62 50, 64 26 Z" 
          fill="url(#flameGrad)" />
    <path d="M64 68 C66 74, 71 78, 71 85 C71 92, 66 98, 60 98 C56 98, 52 95, 52 90 C52 82, 60 76, 64 68 Z" 
          fill="#FFF9D2" />
  </g>

  <!-- Sparkle top right -->
  <polygon points="98,30 102,38 110,42 102,46 98,54 94,46 86,42 94,38" fill="#FFB659" />
</svg>
